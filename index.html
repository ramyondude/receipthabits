<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Habit Receipt | Micro-Habit Cost Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-container">
    
    <header class="app-header">
      <h1>The Habit Receipt<span>.</span></h1>
      <p>See what your small daily habits are actually costing you over time.</p>
    </header>

    <div class="grid-layout">
      
      <!-- INPUT PANEL -->
      <section class="panel input-panel">
        <h2>Your Habit</h2>
        
        <div class="form-group">
          <label for="habit-name">What's the habit?</label>
          <input type="text" id="habit-name" placeholder="e.g., Daily Coffee, Food Delivery, Premium Apps" value="Daily Coffee">
        </div>

        <div class="form-group">
          <label for="habit-cost">How much does it cost each time?</label>
          <div class="input-with-symbol">
            <span class="currency-symbol">$</span>
            <input type="number" id="habit-cost" value="7" min="1" step="0.50">
          </div>
          <input type="range" id="cost-slider" min="1" max="100" value="7" class="slider">
        </div>

        <div class="form-group">
          <label>How often?</label>
          <div class="segmented-control">
            <input type="radio" name="frequency" id="freq-daily" value="daily" checked>
            <label for="freq-daily">Daily</label>
            
            <input type="radio" name="frequency" id="freq-weekly" value="weekly">
            <label for="freq-weekly">Weekly</label>
            
            <input type="radio" name="frequency" id="freq-monthly" value="monthly">
            <label for="freq-monthly">Monthly</label>
          </div>
        </div>

        <div class="form-group">
          <label for="time-horizon">Time Horizon: <span id="years-display">20</span> Years</label>
          <input type="range" id="time-slider" min="1" max="40" value="20" class="slider">
        </div>
      </section>

      <!-- OUTPUT DASHBOARD -->
      <section class="panel output-panel">
        <h2>The Real Cost</h2>
        
        <div class="odometer-container">
          <div class="main-stat">
            <span class="stat-label">Total Future Value (8% Return)</span>
            <div class="stat-value" id="future-value-display">$125,984</div>
          </div>
          
          <div class="sub-stat">
            <span>Pure Cash Spent: </span>
            <strong id="cash-spent-display">$51,139</strong>
          </div>
        </div>

        <hr class="divider">

        <h3>What you could buy instead:</h3>
        <div class="item-grid" id="item-matches-container">
          <!-- Populated by JavaScript -->
        </div>

        <blockquote class="insight-box" id="insight-display">
          At year 20, this habit officially costs more than a brand new luxury car.
        </blockquote>

        <div class="action-area">
          <button id="share-btn" class="btn btn-secondary">📋 Copy Receipt to Clipboard</button>
          <button id="pro-unlock-btn" class="btn btn-primary btn-premium">✨ Unlock Multi-Habit Tracking ($2.99)</button>
        </div>
      </section>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
